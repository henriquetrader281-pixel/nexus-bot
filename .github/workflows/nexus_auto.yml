name: Nexus Bot Autonomous Pipeline

on:
  schedule:
    - cron: '0 9,18 * * *' # Roda às 09:00 e 18:00
  workflow_dispatch: # Botão de 1 clique no GitHub

jobs:
  run-nexus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install & Run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          pip install groq openai requests pandas streamlit
          python nexus_autonome.py
